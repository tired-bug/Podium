<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0D1117;
      border: 1px solid #30363D;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #E6EDF3;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #2F81F7, #A371F7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .logo-text {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.15em;
      background: linear-gradient(90deg, #2F81F7, #A371F7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 12px;
      color: #8B949E;
      margin-bottom: 36px;
      letter-spacing: 0.05em;
    }
    .bar-wrap {
      width: 220px;
      height: 2px;
      background: #21262D;
      border-radius: 2px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      background: linear-gradient(90deg, #2F81F7, #A371F7);
      border-radius: 2px;
      animation: load 1.8s ease-in-out infinite;
    }
    @keyframes load {
      0%   { width: 0%;   margin-left: 0%; }
      50%  { width: 60%;  margin-left: 20%; }
      100% { width: 0%;   margin-left: 100%; }
    }
    .status {
      margin-top: 14px;
      font-size: 11px;
      color: #484F58;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .version {
      position: absolute;
      bottom: 14px;
      font-size: 10px;
      color: #30363D;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">PODIUM</div>
  </div>
  <div class="tagline">AIOps for modern DevOps teams</div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="status">Starting services...</div>
  <div class="version">v4.0.0</div>
</body>
</html>
