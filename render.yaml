services:
  - type: web
    name: podium-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node --no-warnings dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: PODIUM_DATA_DIR
        value: /app/data
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: podium-data
      mountPath: /app/data
      sizeGB: 1
